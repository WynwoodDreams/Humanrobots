<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobotHub | The Rise of Humanoid Robots 2026</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-void: #0a0a0a;
            --accent-acid: #D4FF00;
            --font-display: 'Oswald', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-void);
            color: #EAEAEA;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- Data ---
        const robots = [
            {
                id: 'figure02', name: 'Figure 02', company: 'Figure AI', img: './assets/robot_figure.png',
                emoji: "🦾", valuation: "$39B", status: "Pilot Deployment", theme: "text-blue-400 border-blue-400",
                desc: "Second-generation humanoid with end-to-end neural networks. Deployed at BMW.",
                specs: { height: "1.68m", weight: "60kg", payload: "20kg", dof: "41" },
                metrics: { speed: 85, battery: 70 },
                tags: ["Helix AI", "BMW Partner", "End-to-end NN"]
            },
            {
                id: 'phoenix', name: 'Phoenix', company: 'Sanctuary AI', img: './assets/robot_phoenix.png',
                emoji: "👐", valuation: "Undisclosed", status: "Prototype", theme: "text-red-400 border-red-400",
                desc: "Features industry-leading dexterity with human-like hands (110 DoF). Powered by Carbon AI.",
                specs: { height: "1.70m", weight: "75kg", payload: "25kg", dof: "110" },
                metrics: { speed: 60, battery: 50 },
                tags: ["Carbon AI", "Human Dexterity", "Teleop Hybrid"]
            },
            {
                id: 'atlas', name: 'Atlas', company: 'Boston Dynamics', img: './assets/robot_atlas.png',
                emoji: "⚡", valuation: "Hyundai Owned", status: "Production Ready", theme: "text-[#D4FF00] border-[#D4FF00]",
                desc: "Fully electric commercial robot. Stronger, more agile, and completely untethered.",
                specs: { height: "1.50m", weight: "89kg", payload: "N/A", dof: "56" },
                metrics: { speed: 95, battery: 60 },
                tags: ["DeepMind Core", "360° Vision", "Electric"]
            },
            {
                id: 'gr1', name: 'GR-1', company: 'Fourier Intelligence', img: './assets/robot_gr1.png',
                emoji: "🏥", valuation: "Series A", status: "Prototype", theme: "text-purple-400 border-purple-400",
                desc: "Specialized for rehabilitation and elderly care with high payload capacity.",
                specs: { height: "1.65m", weight: "55kg", payload: "50kg", dof: "44" },
                metrics: { speed: 40, battery: 80 },
                tags: ["Rehabilitation", "Elderly Care", "High Payload"]
            },
            {
                id: 'digit', name: 'Digit', company: 'Agility Robotics', img: './assets/robot_digit.png',
                emoji: "📦", valuation: "$1B+", status: "Production Ready", theme: "text-[#D4FF00] border-[#D4FF00]",
                desc: "First commercially available humanoid focused on logistics (Amazon/GXO).",
                specs: { height: "1.75m", weight: "65kg", payload: "16kg", dof: "30" },
                metrics: { speed: 75, battery: 85 },
                tags: ["Amazon Deployed", "GXO Logistics", "Backwards Legs"]
            },
            {
                id: 'eve', name: 'EVE', company: '1X Tech', img: './assets/robot_eve.png',
                emoji: "🛡️", valuation: "Series B", status: "Pilot Deployment", theme: "text-blue-400 border-blue-400",
                desc: "Wheeled android designed for security and guarding tasks via ADT.",
                specs: { height: "1.86m", weight: "86kg", payload: "15kg", dof: "28" },
                metrics: { speed: 90, battery: 90 },
                tags: ["Wheeled", "Security focus", "ADT Partner"]
            },
            {
                id: 'neo', name: 'NEO', company: '1X Tech', img: './assets/robot_neo.png',
                emoji: "🏠", valuation: "Series B", status: "Prototype", theme: "text-gray-300 border-gray-300",
                desc: "Consumer-focused android with soft outer shell for home assistance.",
                specs: { height: "1.65m", weight: "30kg", payload: "10kg", dof: "Undefined" },
                metrics: { speed: 65, battery: 60 },
                tags: ["Consumer Focus", "Soft Shell", "Safety First"]
            },
            {
                id: 'optimus', name: 'Optimus Gen 3', company: 'Tesla', img: './assets/robot_optimus.png',
                emoji: "🔋", valuation: "Internal", status: "Pilot Deployment", theme: "text-blue-400 border-blue-400",
                desc: "Tesla's general purpose humanoid using FSD AI stack. Latest generation.",
                specs: { height: "1.73m", weight: "57kg", payload: "20kg", dof: "40+" },
                metrics: { speed: 80, battery: 95 },
                tags: ["Mass Production", "FSD Brain", "22 DoF Hands"]
            },
            {
                id: 'apollo', name: 'Apollo', company: 'Apptronik', img: './assets/robot_apollo.png',
                emoji: "🚀", valuation: "$1B+", status: "Pilot Deployment", theme: "text-orange-400 border-orange-400",
                desc: "NASA-heritage design built for mass manufacturability.",
                specs: { height: "1.73m", weight: "73kg", payload: "25kg", dof: "30+" },
                metrics: { speed: 70, battery: 75 },
                tags: ["NASA Heritage", "Mercedes Partner", "Modular"]
            }
        ];

        const stockTickers = {
            'Tesla': { symbol: 'TSLA', public: true },
            'Boston Dynamics': { symbol: 'HYMTF', public: true, label: 'Hyundai' },
            'Alphabet': { symbol: 'GOOGL', public: true },
            'Figure AI': { symbol: null, public: false },
            'Agility Robotics': { symbol: null, public: false },
            '1X Technologies': { symbol: null, public: false },
            'Sanctuary AI': { symbol: null, public: false },
            'Fourier Intelligence': { symbol: null, public: false },
            'Apptronik': { symbol: null, public: false },
        };

        const newsItems = [
            { category: "product", robot: "Atlas", company: "Boston Dynamics", date: "JAN 07, 2026", title: "Boston Dynamics Atlas Production Launch at CES 2026", desc: "In a surprise keynote at CES 2026, Boston Dynamics announced the immediate availability of the electric Atlas for commercial partners, backed by a massive Google DeepMind partnership.", img: "./news_atlas.png", source: "bostondynamics.com", sourceUrl: "https://bostondynamics.com/atlas/", featured: true, pinned: true },
            { category: "finance", robot: "Figure 02", company: "Figure AI", date: "MAR 15, 2026", title: "Figure AI $39B Valuation", desc: "New funding round cements Figure as the most valuable private robotics firm." },
            { category: "milestone", robot: "Digit", company: "Agility Robotics", date: "MAR 03, 2026", title: "Digit Hits 100K Totes", desc: "GXO Logistics confirms Agility's Digit has moved its 100,000th tote with zero failures." },
            { category: "consumer", robot: "NEO", company: "1X Technologies", date: "FEB 28, 2026", title: "1X NEO Pre-orders Sell Out", desc: "At $20K, the home assistant robot sold out its initial batch of 10,000 units in 4 hours." },
            { category: "product", robot: "Optimus Gen 3", company: "Tesla", date: "FEB 12, 2026", title: "Optimus Gen 3 Mass Production", desc: "Fremont lines are now outputting 50 units/day with the new 22-DoF hand design." }
        ];

        const videos = [
            { title: "Boston Dynamics Atlas", url: "https://www.youtube.com/embed/29ECwExc-_M" },
            { title: "Tesla Optimus Gen 2", url: "https://www.youtube.com/embed/cpraXaw7dyc" },
            { title: "Figure 01 OpenAI Demo", url: "https://www.youtube.com/embed/Sq1QZB5baNw" }
        ];

        // --- Components ---

        const NavLink = ({ children }) => (
            <a href="#" className="text-gray-500 hover:text-[#D4FF00] transition-colors group">
                <span className="opacity-0 group-hover:opacity-100 transition-opacity mr-1">[</span>
                {children}
                <span className="opacity-0 group-hover:opacity-100 transition-opacity ml-1">]</span>
            </a>
        );

        const RobotCard = ({ robot, activeId, setActiveId, onLeave, onClick, lockedId }) => {
            const isHovered = activeId === robot.id;
            const isDimmed = activeId && activeId !== robot.id;
            const isLocked = lockedId === robot.id;

            return (
                <div
                    className={`relative flex-1 min-w-[80px] h-[500px] flex items-end justify-center cursor-pointer group transition-all duration-300 -ml-4 first:ml-0 ${isLocked ? 'ring-1 ring-[#D4FF00]/30' : ''}`}
                    onMouseEnter={() => setActiveId(robot.id)}
                    onMouseLeave={onLeave}
                    onClick={() => onClick(robot.id)}
                >
                    <motion.div
                        className="absolute bottom-0 w-32 h-8 rounded-[100%] bg-black blur-xl z-0"
                        animate={{ opacity: isHovered ? 1 : 0, scale: isHovered ? 1.2 : 0.5 }}
                    />
                    <motion.img
                        src={robot.img}
                        alt={robot.name}
                        className="relative z-10 w-full h-full object-contain origin-bottom mix-blend-screen"
                        animate={{
                            y: isHovered ? -40 : 0,
                            scale: isHovered ? 1.45 : (isDimmed ? 0.95 : 1.1),
                            filter: isHovered ? "brightness(1.1) contrast(1.1)" : (isDimmed ? "grayscale(100%) brightness(0.3) blur(2px)" : "grayscale(20%) brightness(0.8)"),
                            zIndex: isHovered ? 50 : 1
                        }}
                        transition={{ type: "spring", stiffness: 250, damping: 25 }}
                    />
                </div>
            );
        };

        const StatsPanel = ({ activeId }) => {
            const robot = robots.find(r => r.id === activeId);

            return (
                <div className="hidden lg:block w-96 bg-[#0e0e0e] border-l border-[#222] h-[600px] sticky top-24 p-8 z-40 shadow-2xl">
                    <AnimatePresence mode="wait">
                        {robot ? (
                            <motion.div
                                key={robot.id}
                                initial={{ opacity: 0, x: 20 }}
                                animate={{ opacity: 1, x: 0 }}
                                exit={{ opacity: 0, x: 20 }}
                                className="h-full flex flex-col"
                            >
                                <div className="border-b border-[#D4FF00] pb-6 mb-6">
                                    <div className="text-5xl mb-4">{robot.emoji}</div>
                                    <h2 className="font-['Oswald'] text-5xl uppercase leading-none text-white mb-2">{robot.name}</h2>
                                    <div className="text-[#D4FF00] font-mono text-sm tracking-widest">{robot.company}</div>
                                </div>

                                <div className="grid grid-cols-2 gap-y-6 gap-x-4 mb-8 font-mono text-sm text-gray-400">
                                    <div className="border-b border-gray-800 pb-2">
                                        <div className="text-[10px] tracking-wider uppercase mb-1">HEIGHT</div>
                                        <div className="text-white text-2xl">{robot.specs.height}</div>
                                    </div>
                                    <div className="border-b border-gray-800 pb-2">
                                        <div className="text-[10px] tracking-wider uppercase mb-1">WEIGHT</div>
                                        <div className="text-white text-2xl">{robot.specs.weight}</div>
                                    </div>
                                    <div className="border-b border-gray-800 pb-2">
                                        <div className="text-[10px] tracking-wider uppercase mb-1">PAYLOAD</div>
                                        <div className="text-white text-2xl">{robot.specs.payload}</div>
                                    </div>
                                    <div className="border-b border-gray-800 pb-2">
                                        <div className="text-[10px] tracking-wider uppercase mb-1">DOF</div>
                                        <div className="text-white text-2xl">{robot.specs.dof}</div>
                                    </div>
                                </div>

                                <div className="mb-8">
                                    <div className="flex justify-between text-xs font-mono text-gray-500 mb-2 uppercase tracking-wider">
                                        <span>MOBILITY_INDEX</span>
                                        <span>{robot.metrics.speed}%</span>
                                    </div>
                                    <div className="h-2 bg-gray-900 w-full rounded-full overflow-hidden"><div className="h-full bg-[#D4FF00]" style={{ width: `${robot.metrics.speed}%` }}></div></div>
                                </div>

                                <p className="text-base text-gray-300 leading-relaxed mb-8 font-light border-l-2 border-gray-700 pl-4">{robot.desc}</p>

                                <div className="flex flex-wrap gap-2 mt-auto">
                                    {robot.tags.map(tag => (
                                        <span key={tag} className="border border-gray-800 bg-gray-900/50 text-gray-400 text-xs px-3 py-1 uppercase tracking-wider">{tag}</span>
                                    ))}
                                </div>
                            </motion.div>
                        ) : (
                            <div className="h-full flex flex-col items-center justify-center text-gray-700 font-mono text-center">
                                <div className="text-6xl mb-6 animate-pulse text-[#D4FF00] opacity-20">scan</div>
                                <p className="text-sm tracking-widest uppercase">Select Unit<br />To Initialize</p>
                            </div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const categoryColors = {
            product: 'text-[#D4FF00] border-[#D4FF00]',
            finance: 'text-[#00F0FF] border-[#00F0FF]',
            milestone: 'text-purple-400 border-purple-400',
            market: 'text-yellow-400 border-yellow-400',
            consumer: 'text-orange-400 border-orange-400',
        };

        const StockBadge = ({ company }) => {
            const info = stockTickers[company];
            if (!info) return null;
            return (
                <span className={`font-mono text-[10px] inline-flex items-center gap-1.5 px-2 py-0.5 border ${info.public ? 'border-[#00F0FF]' : 'border-[#333]'}`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${info.public ? 'bg-[#00F0FF]' : 'bg-gray-600'}`}></span>
                    {info.public ? <><span className="text-white font-bold">{info.symbol}</span> <span className="text-gray-500">{info.label || company}</span></> : <span className="text-gray-500">Private</span>}
                </span>
            );
        };

        const CategoryBadge = ({ category }) => (
            <span className={`font-mono text-[10px] uppercase tracking-wider px-2 py-0.5 border ${categoryColors[category] || 'text-gray-400 border-gray-600'}`}>
                {category}
            </span>
        );

        const FeaturedNewsCard = ({ item }) => (
            <div className="border-r border-[#333] bg-[#0a0a0a] flex flex-col group">
                <div className="overflow-hidden bg-gray-900 relative">
                    <img src={item.img} alt={item.title} className="w-full aspect-video object-cover grayscale-[60%] group-hover:grayscale-0 transition-all duration-500 opacity-80 group-hover:opacity-100" />
                </div>
                <div className="p-6 flex flex-col flex-1">
                    <div className="flex items-center gap-2 flex-wrap mb-3">
                        {item.pinned && <span className="font-mono text-[10px] uppercase tracking-widest text-red-500 border border-red-500 px-2 py-0.5 animate-pulse">Pinned</span>}
                        <CategoryBadge category={item.category} />
                        <span className="font-mono text-[10px] text-gray-600 bg-white/[0.03] px-1.5 py-0.5">{item.robot}</span>
                        <StockBadge company={item.company} />
                    </div>
                    <h3 className="font-['Oswald'] text-2xl text-white mb-2 leading-tight">{item.title}</h3>
                    <p className="text-gray-400 text-sm leading-relaxed mb-4">{item.desc}</p>
                    <div className="flex justify-between items-center mt-auto pt-3">
                        {item.sourceUrl && <a href={item.sourceUrl} target="_blank" className="font-mono text-[11px] text-[#D4FF00] hover:underline">{item.source} →</a>}
                        <time className="font-mono text-[10px] text-gray-600">{item.date}</time>
                    </div>
                </div>
            </div>
        );

        const FeedItem = ({ item }) => (
            <div className="px-5 py-4 border-b border-[#333] last:border-b-0 hover:bg-white/[0.02] transition-colors grid grid-cols-[1fr_auto] gap-4 items-start">
                <div>
                    <div className="flex items-center gap-2 flex-wrap mb-1.5">
                        <CategoryBadge category={item.category} />
                        <span className="font-mono text-[10px] text-gray-600 bg-white/[0.03] px-1.5 py-0.5">{item.robot}</span>
                        <StockBadge company={item.company} />
                    </div>
                    <h3 className="font-['Oswald'] text-lg text-white mb-1 leading-snug">{item.title}</h3>
                    <p className="text-gray-500 text-xs leading-relaxed line-clamp-2">{item.desc}</p>
                </div>
                <time className="font-mono text-[10px] text-gray-600 whitespace-nowrap">{item.date?.split(',')[0]}</time>
            </div>
        );

        const App = () => {
            const [activeId, setActiveId] = useState(null);
            const [lockedId, setLockedId] = useState(null);
            const [newsFilter, setNewsFilter] = useState('all');

            const handleHover = (id) => { if (!lockedId) setActiveId(id); };
            const handleLeave = () => { if (!lockedId) setActiveId(null); };
            const handleClick = (id) => {
                if (lockedId === id) { setLockedId(null); setActiveId(null); }
                else { setLockedId(id); setActiveId(id); }
            };

            const filteredNews = newsFilter === 'all'
                ? newsItems
                : newsItems.filter(n => n.category === newsFilter);

            return (
                <div className="min-h-screen text-white">
                    {/* Header */}
                    <header className="fixed top-0 w-full z-50 bg-[#0a0a0a]/90 backdrop-blur border-b border-[#333]">
                        <div className="max-w-[1800px] mx-auto px-6 h-20 flex justify-between items-center">
                            <div className="font-mono font-bold flex items-center gap-2">
                                <span className="text-[#D4FF00]">//</span> ROBOT_HUB [BETA]
                            </div>
                            <nav className="hidden md:flex gap-8 font-mono text-sm tracking-widest uppercase">
                                <NavLink>Inventory</NavLink>
                                <NavLink>Intel</NavLink>
                                <NavLink>Vision</NavLink>
                            </nav>
                            <div className="border border-red-500 text-red-500 px-3 py-1 font-mono text-xs flex items-center gap-2 bg-red-500/10">
                                <div className="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div> SYSTEM ONLINE
                            </div>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="pt-32 pb-20 border-b border-[#333] relative">
                        <div className="absolute top-40 left-0 w-full text-center pointer-events-none opacity-5">
                            <h1 className="font-['Oswald'] text-[15vw] leading-none text-white whitespace-nowrap">EMBODIED AI</h1>
                        </div>

                        <div className="max-w-[1800px] mx-auto px-6 grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-12 items-start">
                            {/* Inventory Stage */}
                            <div className="relative border border-[#333] bg-[#111] h-[600px] flex items-end justify-center overflow-hidden">
                                <div className="absolute top-4 left-4 font-mono text-xs text-[#D4FF00] z-20">FIG. 01 // LINEUP</div>
                                <div className="flex w-full px-4 h-full items-end pb-0 justify-around">
                                    {robots.map(robot => (
                                        <RobotCard key={robot.id} robot={robot} activeId={activeId}
                                            setActiveId={handleHover} onLeave={handleLeave} onClick={handleClick} lockedId={lockedId} />
                                    ))}
                                </div>
                                <div className="absolute inset-0 pointer-events-none bg-radial-gradient from-transparent to-black opacity-50"></div>
                            </div>

                            {/* Stats HUD */}
                            <StatsPanel activeId={activeId} />
                        </div>
                    </section>

                    {/* News Section - Intelligence Feed */}
                    <section className="py-20 border-b border-[#333] bg-[#0e0e0e]">
                        <div className="max-w-[1800px] mx-auto px-6">
                            {/* Header + Filters */}
                            <div className="flex justify-between items-end flex-wrap gap-4 mb-6">
                                <div>
                                    <h2 className="font-['Oswald'] text-3xl mb-1">// SECTOR_INTEL</h2>
                                    <p className="font-mono text-[10px] text-gray-600 uppercase tracking-widest">Robotics news, market signals, and milestone tracking</p>
                                </div>
                                <div className="flex border border-[#333]">
                                    {['all', 'product', 'finance', 'milestone', 'consumer'].map(f => (
                                        <button key={f}
                                            onClick={() => setNewsFilter(f)}
                                            className={`font-mono text-[10px] uppercase tracking-wider px-3 py-2 border-r border-[#333] last:border-r-0 transition-colors ${newsFilter === f ? 'text-[#D4FF00] bg-[#D4FF00]/5' : 'text-gray-600 hover:text-gray-300'}`}>
                                            {f}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Two-panel: featured left, feed right */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 border border-[#333]">
                                {filteredNews.filter(n => n.featured)[0] && (
                                    <FeaturedNewsCard item={filteredNews.filter(n => n.featured)[0]} />
                                )}
                                <div className="flex flex-col bg-[#0a0a0a]">
                                    {filteredNews.filter(n => !n.featured).map((item, i) => (
                                        <FeedItem key={i} item={item} />
                                    ))}
                                    {filteredNews.filter(n => !n.featured).length === 0 && (
                                        <div className="p-8 text-center font-mono text-xs text-gray-600">No stories in this category</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Video Section */}
                    <section className="py-24 bg-black">
                        <div className="max-w-[1800px] mx-auto px-6">
                            <h2 className="font-['Oswald'] text-4xl mb-12">🎬 // VISUAL_ARCHIVE</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {videos.map((vid, i) => (
                                    <div key={i} className="border border-[#333] p-1 bg-[#111]">
                                        <div className="aspect-video relative">
                                            <iframe src={vid.url} className="absolute inset-0 w-full h-full border-0" loading="lazy" allowFullScreen></iframe>
                                        </div>
                                        <h4 className="font-mono text-sm p-4 text-center">{vid.title}</h4>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <footer className="py-12 border-t border-[#333] text-center font-mono text-xs text-gray-600">
                        ROBOT_HUB // 2026 // TRACKING_EMBODIED_AI
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
